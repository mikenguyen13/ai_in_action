<!-- Minimal cookie consent banner (no external dependency) -->
<style>
  #cookie-banner {
    position: fixed;
    left: 1rem;
    right: 1rem;
    bottom: 1rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0.9rem 1rem;
    border-radius: 0.75rem;
    background: rgba(255,255,255,0.97);
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    z-index: 9999;
    display: none;
  }
  #cookie-banner .row {
    display: flex;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  #cookie-banner .actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  #cookie-banner button {
    border-radius: 0.6rem;
    padding: 0.5rem 0.8rem;
    border: 1px solid #ddd;
    background: #f7f7f7;
    cursor: pointer;
  }
  #cookie-banner button.primary {
    background: #0d6efd;
    border-color: #0d6efd;
    color: #fff;
  }
  #cookie-banner small {
    color: #555;
  }
</style>

<div id="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie consent">
  <div class="row">
    <div>
      <div><strong>Cookies and analytics</strong></div>
      <small>
        This site uses cookies for basic functionality and anonymous analytics.
        You can accept or decline analytics cookies.
        See the <a href="./cookies.html">Cookies</a> and <a href="./privacy.html">Privacy</a> pages.
      </small>
    </div>
    <div class="actions">
      <button id="cookie-decline">Decline</button>
      <button id="cookie-accept" class="primary">Accept</button>
    </div>
  </div>
</div>

<script>
  (function () {
    const KEY = "cookie_consent_v1"; // bump version if you change policy
    const banner = document.getElementById("cookie-banner");
    const acceptBtn = document.getElementById("cookie-accept");
    const declineBtn = document.getElementById("cookie-decline");

    function setConsent(value) {
      localStorage.setItem(KEY, value); // "accepted" or "declined"
      window.dispatchEvent(new CustomEvent("cookie-consent-changed", { detail: value }));
    }

    function getConsent() {
      return localStorage.getItem(KEY);
    }

    const consent = getConsent();
    if (!consent) {
      banner.style.display = "block";
    }

    acceptBtn.addEventListener("click", function () {
      banner.style.display = "none";
      setConsent("accepted");
    });

    declineBtn.addEventListener("click", function () {
      banner.style.display = "none";
      setConsent("declined");
    });
  })();
</script>
