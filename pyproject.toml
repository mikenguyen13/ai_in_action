[project]
name = "aiinaction"
version = "0.1.0"
description = "Reusable, tested reference implementations accompanying the AI in Action book"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black>=26.1.0",
    "httpx>=0.28.1",
    "jupyter-cache>=1.0.1",
    "levenshtein>=0.27.3",
    "matplotlib>=3.10.7",
    "mcp>=1.25.0",
    "mlforecast>=1.0.2",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "nest-asyncio>=1.6.0",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.92",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "polars>=1.35.2",
    "pykeen>=1.11.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "sktime>=0.40.1",
    "statsmodels>=0.14.6",
    "torch>=2.9.1",
    "torch-geometric>=2.7.0",
    "torchmetrics>=1.8.2",
    "tscv>=0.1.3",
    "lightgbm>=4.5.0",
    "catboost>=1.2.7",
    "umap-learn>=0.5.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
