format:
  html:
    # theme: cosmo
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-tools: true
    highlight-style: github
    css: styles.css
    footnotes-hover: true
    citations-hover: true

     # Site search box in navbar
    search: true

    # Social sharing preview cards
    open-graph: true
    twitter-card: true

    # Put your favicon in the repo root (or adjust the path)
    favicon: "favicon.ico"

    # SEO: schema.org structured data + search-engine verification.
    # (Cookie-consent include is disabled; re-add it here if reinstated.)
    include-in-header:
      - _includes/seo-head.html
    include-after-body:
      - _includes/gtag-loader.html
      - _includes/year.js
      - _includes/fold-static-code.html

  pdf:
    documentclass: book
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
    number-sections: true
    toc: true
    toc-depth: 3
    colorlinks: true
  epub:
    toc: true
    toc-depth: 3
    number-sections: true
  


execute:
  freeze: auto
  cache: true

lang: en
bibliography: references.bib