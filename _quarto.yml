project:
  type: book
  output-dir: docs
  # output-dir: _book
  resources:
    - robots.txt
    - favicon.ico
    - favicon.svg

book:
  title: "AI in Action"
  subtitle: "A Reference for Artificial Intelligence"
  author: "Mike Nguyen"
  date: "11/18/2025"
  description: "A rigorous, implementation-first reference for modern artificial intelligence: foundations, machine learning, deep learning, large language models, retrieval-augmented generation, and AI agents, taught with mathematics and runnable Python."
  # Canonical address of the PUBLISHED site (used for sitemap, canonical
  # links, and social cards). This must be the live URL, not the repo.
  # If you move to a custom domain, change this and add a docs/CNAME file.
  site-url: "https://mikenguyen13.github.io/ai_in_action/"
  repo-url: "https://github.com/mikenguyen13/ai_in_action"
  repo-branch: "main"
  # Adds "Edit this page" and "Report an issue" links (top-right area, depending on theme)
  repo-actions: [edit, issue]
  sidebar:
    collapse-level: 1
   # Global top navigation
  # navbar:
  #   background: light
  #   pinned: true
